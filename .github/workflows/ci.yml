name: SEUConnect CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Verify JavaScript Syntax
        run: |
          node --check src/server.js
          find src -name "*.js" -exec node --check {} +
          echo "All backend files passed syntax verification."

  frontend-ci:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Build Production Assets (Vite)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html
          echo "Frontend build successfully generated dist/index.html"

  deployment-status:
    name: Deployment Summary
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Output Deployment & Service URLs
        run: |
          echo "=========================================================="
          echo "  SEUConnect CI/CD Pipeline Completed Successfully!       "
          echo "=========================================================="
          echo "Frontend Service : https://seuconnect-frontend.onrender.com"
          echo "Backend Service  : https://seuconnect-backend.onrender.com"
          echo "Branch           : ${{ github.ref_name }}"
          echo "Commit           : ${{ github.sha }}"
          echo "=========================================================="
